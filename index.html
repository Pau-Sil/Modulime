<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#282828">
    <title>Modulime</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23282828'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-size='22' font-weight='700' font-family='sans-serif' fill='%23dcb054'%3EM%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main class="app">
        <header class="header">
            <h1 class="title">Modulime</h1>
        </header>

        <section class="tracker">
            <div id="display" class="display">00:00:00</div>
            <div id="statusBadge" class="badge">Listo</div>

            <div class="controls">
                <button id="btnMain" class="btn btn-primary">Iniciar</button>
                <button id="btnFinish" class="btn btn-success hidden">Terminar</button>
                <button id="btnDiscard" class="btn btn-danger btn-icon hidden" title="Descartar sesión">✕</button>
            </div>
        </section>

        <section class="stats">
            <div class="bank">
                Banco: <span id="bankDisplay" class="bank-value">0</span> min
            </div>
            <hr class="divider">
            <p id="message" class="message">Esperando...</p>
        </section>

        <section class="history-section">
            <h3 class="history-title">Historial Local</h3>
            <div class="history-container">
                <table id="historyTable" class="history-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Horas</th>
                            <th>Descripción</th>
                            <th>Proyecto</th>
                            <th class="sync-col">Sync</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <footer class="data-controls">
            <button id="btnConfigWebhook" class="btn btn-small">Config Sheet URL</button>
            <button id="btnSyncRetry" class="btn btn-small">Reintentar sync</button>
            <button id="btnExportJson" class="btn btn-small">Backup JSON</button>
            <button id="btnImportJson" class="btn btn-small">Restaurar JSON</button>
            <button id="btnReset" class="btn btn-small btn-danger-outline">Borrar Datos</button>
            <input type="file" id="importFile" accept=".json" class="hidden">
        </footer>
    </main>

    <div id="finishModal" class="modal hidden">
        <div class="modal-content">
            <h2 class="modal-title">Finalizar Sesión</h2>

            <div id="modalStats" class="modal-stats">
                <!-- Se inyecta por JS -->
            </div>

            <div id="descContainer" class="modal-desc-container hidden">
                <div class="input-group">
                    <label for="sessionProject">Proyecto</label>
                    <input type="text" id="sessionProject" list="projectList" placeholder="Ej: Gutenflyerg, Modulime..." class="modal-input">
                    <datalist id="projectList"></datalist>
                </div>

                <div class="input-group">
                    <label id="descLabel" for="sessionDesc">¿Qué hiciste en estas horas?</label>
                    <textarea id="sessionDesc" rows="4" placeholder="Ej: Fix bug en navbar, diseño de vista principal..."></textarea>
                </div>
            </div>

            <div class="modal-actions">
                <button id="btnConfirmFinish" class="btn btn-success">Confirmar</button>
                <button id="btnCancelFinish" class="btn btn-text">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="dialogModal" class="modal hidden">
        <div class="modal-content dialog-content">
            <p id="dialogMessage" class="dialog-message"></p>
            <div class="modal-actions">
                <button id="btnDialogOk" class="btn btn-primary">Aceptar</button>
                <button id="btnDialogCancel" class="btn btn-text hidden">Cancelar</button>
            </div>
        </div>
    </div>

    <script type="module" src="./scripts/app.js"></script>
</body>
</html>
