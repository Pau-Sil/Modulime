<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">
        <header class="header">
            <h1 class="title">Modulime</h1>
        </header>

        <section class="tracker">
            <div id="display" class="display">00:00:00</div>
            <div id="statusBadge" class="badge">Listo</div>

            <div class="controls">
                <button id="btnMain" class="btn btn-primary">Iniciar</button>
                <button id="btnFinish" class="btn btn-success hidden">Terminar</button>
                <button id="btnDiscard" class="btn btn-danger btn-icon hidden" title="Descartar sesión">✕</button>
            </div>
        </section>

        <section class="stats">
            <div class="bank">
                Banco: <span id="bankDisplay" class="bank-value">0</span> min
            </div>
            <hr class="divider">
            <p id="message" class="message">Esperando...</p>
        </section>

        <section class="history-container">
            <h3 class="history-title">Historial Local</h3>
            <table id="historyTable" class="history-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Horas</th>
                        <th>Descripción</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <footer class="data-controls">
            <button id="btnConfigWebhook" class="btn btn-small">Config Sheet URL</button>
            <button id="btnExportJson" class="btn btn-small">Backup JSON</button>
            <button id="btnImportJson" class="btn btn-small">Restaurar JSON</button>
            <button id="btnReset" class="btn btn-small btn-danger-outline">Borrar Datos</button>
            <input type="file" id="importFile" accept=".json" class="hidden">
        </footer>
    </main>

    <div id="finishModal" class="modal hidden">
        <div class="modal-content">
            <h2 class="modal-title">Finalizar Sesión</h2>

            <div id="modalStats" class="modal-stats">
                <!-- Se inyecta por JS -->
            </div>

            <div id="descContainer" class="modal-desc-container hidden">
                <label id="descLabel" for="sessionDesc">¿Qué hiciste en estas horas?</label>
                <textarea id="sessionDesc" rows="4" placeholder="Ej: Fix bug en navbar, diseño de vista principal..."></textarea>
            </div>

            <div class="modal-actions">
                <button id="btnConfirmFinish" class="btn btn-success">Confirmar</button>
                <button id="btnCancelFinish" class="btn btn-text">Cancelar</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
