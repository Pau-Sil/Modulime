<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Sesión Actual</h1>
    <div id="display" class="timer">00:00:00</div>
    
    <div class="controls">
        <button id="btnToggle" onclick="toggleTimer()">Iniciar</button>
        <button id="btnReset" onclick="resetBank()" class="btn-danger">Resetear Banco</button>
    </div>

    <div class="stats">
        <p>Banco: <span id="bankDisplay" class="highlight">0</span> min</p>
        <hr class="divider">
        <p id="message">Listo.</p>
    </div>

    <div class="data-controls">
        <button onclick="exportData()" class="btn-small">Exportar JSON</button>
        <button onclick="triggerImport()" class="btn-small">Importar JSON</button>
        <input type="file" id="importFile" accept=".json" onchange="importData(this)">
    </div>

    <script src="script.js"></script>
</body>
</html>
